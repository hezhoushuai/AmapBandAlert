apply plugin: 'com.android.application'

android {
    namespace 'com.amapbandalert'
    compileSdk 34

    defaultConfig {
        applicationId "com.amapbandalert"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "0.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// 纯 Android Framework API，不依赖 AndroidX / Material。
