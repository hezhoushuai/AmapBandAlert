name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK (no gradle)
        id: build
        run: |
          set +e
          bash scripts/build_no_gradle.sh > /tmp/build_output.txt 2>&1
          code=$?
          tail -50 /tmp/build_output.txt > /tmp/error_tail.txt
          if [ $code -ne 0 ]; then
            echo "### ❌ 构建失败" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -iE "error|错误" /tmp/build_output.txt | head -20 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -30 /tmp/build_output.txt >> $GITHUB_STEP_SUMMARY
            mkdir -p /tmp/logrepo
            cd /tmp/logrepo
            git init -q
            git config user.name "ci-bot"
            git config user.email "ci@local"
            git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
            git fetch origin build-logs || true
            git checkout -b build-logs origin/build-logs 2>/dev/null || git checkout --orphan build-logs
            cp /tmp/error_tail.txt ./latest_error.txt
            cp /tmp/build_output.txt ./full_output.txt
            git add -A
            git commit -qm "build log $(date -u +%Y%m%d%H%M%S)"
            git push -q origin build-logs
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AmapBandAlert-debug-apk
          path: android-app/AmapBandAlert-debug.apk
