name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        working-directory: android-app
        id: build
        run: gradle assembleDebug --no-daemon 2>&1 | tee build.log || echo "BUILD_FAILED=1" >> $GITHUB_ENV

      - name: Report errors
        if: env.BUILD_FAILED == '1'
        run: grep -A 5 -B 2 -iE "error|FAILED" build.log | head -80 >> $GITHUB_STEP_SUMMARY
          && tail -60 build.log > error_tail.txt
          && echo "错误摘要见Summary; 完整尾部:" && cat error_tail.txt

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android-app/build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AmapBandAlert-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
