name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Parser regression tests
        run: bash scripts/test_parser.sh

      - name: Build and Deliver (verbose)
        run: |
          set +e
          echo "===== 1. 构建开始(输出直接进Actions日志) ====="
          bash scripts/build_no_gradle.sh 2>&1
          BUILD_CODE=$?
          echo "===== 构建退出码: $BUILD_CODE ====="

          echo "===== 2. APK信息 ====="
          ls -la AmapBandAlert-debug.apk || true

          echo "===== 3. 推APK到apk-delivery分支 ====="
          mkdir -p /tmp/apks
          cp AmapBandAlert-debug.apk /tmp/apks/ || true
          mkdir -p /tmp/deliver
          cd /tmp/deliver
          git init -q
          git config user.name "ci-bot"
          git config user.email "ci@local"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin apk-delivery 2>&1 || true
          git checkout -b apk-delivery origin/apk-delivery 2>/dev/null || git checkout --orphan apk-delivery
          git rm -rf . 2>/dev/null || true
          mkdir -p apks
          cp /tmp/apks/AmapBandAlert-debug.apk apks/
          git add -A
          git commit -qm "APK $(date -u +%Y%m%d%H%M%S)" || true
          git push -f origin apk-delivery 2>&1 || true
          echo "===== 完成 ====="
