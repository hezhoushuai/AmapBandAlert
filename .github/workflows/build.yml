name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        working-directory: android-app
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > /tmp/gradle_output.txt 2>&1
          EXIT_CODE=$?
          # 把输出尾部(含错误)写入Step Summary, 页面直接可见
          tail -100 /tmp/gradle_output.txt > $GITHUB_STEP_SUMMARY
          if [ $EXIT_CODE -ne 0 ]; then
            echo "### ❌ 编译失败, 错误详情见上方" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AmapBandAlert-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
