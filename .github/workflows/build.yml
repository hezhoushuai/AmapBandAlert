name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK (no gradle)
        run: |
          set +e
          bash scripts/build_no_gradle.sh > /tmp/build_output.txt 2>&1
          code=$?
          tail -50 /tmp/build_output.txt > /tmp/error_tail.txt
          echo "===== 脚本退出码: $code ====="
          tail -20 /tmp/build_output.txt

          if [ $code -ne 0 ]; then
            # 失败: 输出全部(前60+后60行)
            (head -60 /tmp/build_output.txt; echo "...SKIP..."; tail -60 /tmp/build_output.txt) > /tmp/err_lines.txt || true
            while IFS= read -r line; do
              echo "::error::${line:0:280}"
            done < /tmp/err_lines.txt
          fi

          mkdir -p /tmp/logrepo
          cd /tmp/logrepo
          git init -q
          git config user.name "ci-bot"
          git config user.email "ci@local"
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git fetch origin build-logs apk-delivery 2>/dev/null || true

          if true; then
            git checkout -b build-logs origin/build-logs 2>/dev/null || git checkout --orphan build-logs
            cp /tmp/error_tail.txt ./latest_error.txt
            cp /tmp/build_output.txt ./full_output.txt
            git add -A
            git commit -qm "build log $(date -u +%Y%m%d%H%M%S)"
            git push -qf origin build-logs
            echo "❌ 构建失败, 日志已推 build-logs 分支" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # 成功: APK推到 apk-delivery 分支
          APK_SRC="$GITHUB_WORKSPACE/AmapBandAlert-debug.apk"
          ls -la "$APK_SRC"
          mkdir -p /tmp/apks
          cp "$APK_SRC" /tmp/apks/
          git checkout -b apk-delivery origin/apk-delivery 2>/dev/null || git checkout --orphan apk-delivery
          git rm -rf . 2>/dev/null || true
          mkdir -p apks
          cp /tmp/apks/AmapBandAlert-debug.apk apks/
          ls -la apks/
          ls -la apks/
          git add -A
          git commit -qm "APK $(date -u +%Y%m%d%H%M%S)"
          git push -qf origin apk-delivery
          echo "✅ APK已推送到 apk-delivery 分支" >> $GITHUB_STEP_SUMMARY
